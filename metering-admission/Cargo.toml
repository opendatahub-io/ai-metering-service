[package]
name = "metering-admission"
version = "0.1.0"
edition = "2021"

[dependencies]
redis = { version = "1.8", features = ["tokio-native-tls-comp", "connection-manager"] }
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt"] }
thiserror = "2"
async-trait = "0.1.89"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
