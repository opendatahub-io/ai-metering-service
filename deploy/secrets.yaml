apiVersion: v1
kind: Secret
metadata:
  name: metering-secrets
type: Opaque
stringData:
  secrets.yaml: |
    tls:
      certFile: /etc/metering/config/tls.crt
      keyFile: /etc/metering/config/tls.key

    postgres:
      url: postgres://metering:CHANGE_ME@postgres:5432/metering?sslmode=require

    redis:
      url: rediss://default:CHANGE_ME@redis:6379/0
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_PRIVATE_KEY
    -----END PRIVATE KEY-----
